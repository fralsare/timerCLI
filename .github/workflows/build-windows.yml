name: Build Windows exe

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --onefile --console --name TimerAppCLI timerCLI_windows.py
          Rename-Item dist\TimerAppCLI.exe TimerAppCLI-x86_64.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TimerAppCLI-x86_64.exe

      - name: Upload as artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: TimerAppCLI-windows
          path: dist/TimerAppCLI-x86_64.exe
